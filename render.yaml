# Render Blueprint for NeoCampus Full-Stack Deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. DJANGO BACKEND WEB SERVICE
  # -------------------------------------------------------------
  - type: web
    name: neocampus-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "./build.sh"
    startCommand: "gunicorn neocampus.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "neocampus-wylk.onrender.com,.onrender.com,*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DEMO_MODE
        value: "True"
      - key: DEMO_RESET_INTERVAL_HOURS
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # 2. REACT FRONTEND STATIC SITE
  # -------------------------------------------------------------
  - type: web
    name: neocampus-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://neocampus-wylk.onrender.com/api"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
